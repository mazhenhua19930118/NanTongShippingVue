<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title>
    <%= webpackConfig.name %>
  </title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, white, #066eb8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .ocean {
      position: relative;
      width: 100%;
      height: 100px;
      overflow: hidden;
    }

    .wave {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 100px;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg"><path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" opacity=".25" fill="%234a90e2"/></svg>');
      background-size: 50% 100px;
      animation: wave 10s linear infinite;
    }

    .wave:nth-child(2) {
      animation-delay: -5s;
      opacity: 0.5;
    }

    .wave:nth-child(3) {
      animation-delay: -7s;
      opacity: 0.7;
    }

    @keyframes wave {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .ship {
      position: absolute;
      bottom: 50px;
      left: 50%;
      width: 120px;
      height: 80px;
      background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><path d="M20,20 Q40,5 60,20 Q80,5 100,20 L110,30 L110,70 L10,70 L10,30 Z" fill="%23f0f0f0"/><path d="M30,10 Q45,5 60,10 Q75,5 90,10 L95,20 L25,20 Z" fill="%23d0d0d0"/><path d="M50,20 Q55,15 60,20 Q65,15 70,20 L70,30 L50,30 Z" fill="%23e0e0e0"/></svg>');
      background-size: cover;
      transform: translateX(-50%);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      50% {
        transform: translateX(-50%) translateY(-10px);
      }
    }

    .content {
      display: none;
      padding: 20px;
      text-align: center;
    }

    .text {
      position: absolute;
      bottom: 300px;
      left: 50%;
      transform: translateX(-50%);
      animation: float 3s ease-in-out infinite;
      font-size: 20px;
      color: white;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="loading-container" id="loadingContainer">
      <div class="ocean">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>
      <div class="text">正在加载中...</div>
      <div class="ship"></div>
    </div>
  </div>
</body>

</html>
