<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <title>
    <%= webpackConfig.name %>
  </title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    /* ===== 加载页：风格与登录页保持一致 ===== */
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(135deg, #2f7fd0 0%, #4f9fe0 55%, #7cb6e8 100%);
      /* 与登录页 banner 一致的柔光质感 */
      background-image:
        radial-gradient(900px 500px at 20% 20%, rgba(255, 255, 255, .18), transparent 60%),
        radial-gradient(700px 400px at 80% 80%, rgba(80, 160, 240, .40), transparent 60%),
        linear-gradient(135deg, #2f7fd0 0%, #4f9fe0 55%, #7cb6e8 100%);
      overflow: hidden;
    }

    /* 品牌标识：旋转航船 SVG，呼应登录页 aside-ship */
    .brand-ship {
      width: 150px;
      height: 150px;
      opacity: .95;
      animation: shipSpin 22s linear infinite, shipFloat 6s ease-in-out infinite;
      filter: drop-shadow(0 10px 26px rgba(0, 0, 0, .18));
    }

    @keyframes shipSpin {
      from { transform: rotate(0); }
      to   { transform: rotate(360deg); }
    }

    @keyframes shipFloat {
      0%, 100% { margin-top: 0; }
      50%      { margin-top: -16px; }
    }

    .brand-title {
      margin: 28px 0 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, .2);
    }

    .brand-slogan {
      margin: 10px 0 0;
      font-size: 16px;
      letter-spacing: 5px;
      opacity: .9;
    }

    /* 加载指示器：玻璃拟态圆环 + 旋转进度 */
    .loader {
      position: relative;
      width: 56px;
      height: 56px;
      margin-top: 44px;
    }

    .loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, .28);
      border-top-color: #fff;
      animation: spin 1s linear infinite;
      box-shadow: 0 8px 24px rgba(20, 60, 120, .25);
    }

    @keyframes spin {
      from { transform: rotate(0); }
      to   { transform: rotate(360deg); }
    }

    .loader-text {
      margin-top: 18px;
      font-size: 15px;
      letter-spacing: 2px;
      opacity: .92;
    }

    /* 底部装饰波浪，呼应登录页 waves */
    .loading-waves {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 160px;
      pointer-events: none;
    }

    .loading-waves .wave {
      fill: rgba(255, 255, 255, .16);
    }

    .loading-waves .wave1 { animation: waveMove 9s linear infinite; }
    .loading-waves .wave2 { animation: waveMove 13s linear infinite reverse; opacity: .5; }
    .loading-waves .wave3 { animation: waveMove 17s linear infinite; opacity: .3; }

    @keyframes waveMove {
      from { transform: translateX(0); }
      to   { transform: translateX(-1440px); }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="loading-container" id="loadingContainer">
      <!-- 品牌航船 -->
      <svg class="brand-ship" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"
          stroke-dasharray="6 8" />
        <path d="M40 120 L160 120 L146 150 L54 150 Z" fill="rgba(255,255,255,.85)" />
        <path d="M100 40 L100 120 M100 56 L140 80 L100 92 Z" fill="rgba(255,255,255,.9)" />
        <circle cx="100" cy="30" r="7" fill="rgba(255,255,255,.9)" />
      </svg>

      <h1 class="brand-title">智慧航运</h1>
      <p class="brand-slogan">智慧航运 · 通达天下</p>

      <div class="loader">
        <div class="loader-ring"></div>
      </div>
      <div class="loader-text">正在加载中...</div>

      <!-- 底部波浪 -->
      <svg class="loading-waves" viewBox="0 0 1440 200" preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
          <path id="loadingWave"
            d="M0,80 C240,160 480,0 720,80 C960,160 1200,0 1440,80 L1440,200 L0,200 Z" />
        </defs>
        <use href="#loadingWave" class="wave wave1" />
        <use href="#loadingWave" class="wave wave2" />
        <use href="#loadingWave" class="wave wave3" />
      </svg>
    </div>
  </div>
</body>

</html>
